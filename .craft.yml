minVersion: "3.9.0"
github:
  owner: getsentry
  repo: snuba-sdk
changelog:
  filePath: CHANGES.rst
  policy: auto
versioning:
  policy: manual
preReleaseCommand: bash scripts/bump-version.sh
statusProvider:
  name: github
artifactProvider:
  name: github
targets:
  - name: github
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi

requireNames:
  - /^snuba_sdk-.+-py2.py3-none-any.whl$/
